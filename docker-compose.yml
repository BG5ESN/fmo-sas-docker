services:
  fmo-sas:
    image: ghcr.io/YOUR_GITHUB_OWNER/YOUR_REPO:latest
    container_name: fmo-sas
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - fmo-sas-data:/home/sas/.sas
    environment:
      SAS_SERVER_UID: "12345"
      SAS_SERVER_CALLSIGN: "BG5ESN"
      SAS_MQTT_HOST: "your-mqtt-broker.com"
      SAS_MQTT_PORT: "1883"
      SAS_MQTT_USERNAME: "your_username"
      SAS_MQTT_PASSWORD: "your_password"
      SAS_CERT_FINGERPRINT: "gjJGc7xxxxxxxxxxxxxxxxxY"
      SAS_HTTP_ADDR: "0.0.0.0"
      SAS_HTTP_PORT: "8080"

volumes:
  fmo-sas-data:
